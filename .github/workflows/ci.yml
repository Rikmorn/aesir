name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Build workspace libraries (types resolve through dist/)
        run: pnpm --filter @aesir/types --filter @aesir/platform --filter @aesir/observability --filter @aesir/test-utils build

      - name: Typecheck
        run: pnpm typecheck

      - name: Fast tests (no Docker)
        run: pnpm test:fast

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries (types resolve through dist/)
        run: pnpm --filter @aesir/types --filter @aesir/platform --filter @aesir/observability --filter @aesir/test-utils build

      # No service container: each suite starts its own PostgreSQL through
      # testcontainers and applies the package's real migrations, so all it
      # needs is the Docker daemon the runner already provides.
      # shared/env/config.ts validates at import time and calls process.exit(1)
      # when these four are unset, which kills the whole test file before a
      # single test runs. A developer's gitignored .env supplies them locally,
      # and a runner has none. Placeholders are enough: the suite mocks the LLM
      # and MCP boundaries, so nothing here reaches a real API. The same four
      # fallbacks in __integration__/setup.ts cannot cover this -- that module
      # is imported after router.js, which reaches config.ts first (#69).
      - name: Integration tests
        run: pnpm test:integration
        env:
          ANTHROPIC_API_KEY: test-key-not-real
          LINEAR_TEAM_ID: test-team
          GITHUB_REPO: test-org/test-repo
          SLACK_CHANNEL_ID: C000TEST
