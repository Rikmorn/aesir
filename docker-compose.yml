# Aesir Development Infrastructure
#
# Complete containerized setup including agents, integrations, and infrastructure.
# Nginx reverse proxy provides a single entry point for all services.
#
# Basic Usage:
#   docker compose up -d                    # Start all services in background
#   docker compose up                       # Start all services with logs
#   docker compose logs -f agent-service    # View agent logs
#   docker compose down                     # Stop all services
#
# Hot Reload (Watch Mode):
#   docker compose watch                    # Watch all services for file changes
#                                           # Rebuilds containers when source changes
#   docker compose up -d && docker compose watch  # Start then watch
#
# Tunnel (Cloudflare):
#   docker compose --profile tunnel up      # Start with webhook tunnel
#   Point tunnel to nginx:80 for unified routing
#
# Embedding (Ollama):
#   ollama and ollama-init carry no profile, so the documented command above
#   starts them. agent-service defaults to EMBEDDING_PROVIDER=ollama, so
#   directory_find fails without them; a command that only works with an
#   undocumented flag is worse than the cost this imposes, which is the model
#   pull and its memory on every developer machine. Set EMBEDDING_PROVIDER=voyage
#   to use the hosted provider and stop these two instead.
#
# Access (via nginx proxy on port 80):
#   - http://localhost/linear/*   → Linear integration (webhooks, OAuth, MCP)
#   - http://localhost/github/*   → GitHub integration (webhooks, OAuth, MCP)
#   - http://localhost/slack/*    → Slack integration (events, OAuth, MCP)
#   - http://localhost/agent/*    → Agent service (events, conversations, health)
#   - http://localhost/dashboard/* → Dashboard (agent monitoring)
#   - http://localhost/health     → Nginx health check
#
# Direct Access (bypass nginx):
#   - PostgreSQL: localhost:5432
#   - Linear Integration: http://localhost:3001
#   - GitHub Integration: http://localhost:3002
#   - Slack Integration: http://localhost:3003
#   - Agent Service: http://localhost:3004
#   - Dashboard: http://localhost:3005
#
# Webhook URLs (configure in each service):
#   - Linear:  https://<tunnel>/linear/webhook
#   - GitHub:  https://<tunnel>/github/webhooks/github
#   - Slack:   https://<tunnel>/slack/events
#
# OAuth URLs:
#   - Linear: http://localhost/linear/oauth/authorize
#   - GitHub: http://localhost/github/oauth/github/authorize
#   - Slack:  http://localhost/slack/oauth/authorize
#
# Environment:
#   Copy .env.example to .env and fill in API keys.
#   Docker Compose automatically loads .env file.

services:
  postgresql:
    image: pgvector/pgvector:pg15
    container_name: aesir-postgresql
    environment:
      POSTGRES_USER: aesir
      POSTGRES_PASSWORD: aesir
      POSTGRES_DB: aesir
    volumes:
      - aesir-postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Expose for LangGraph checkpointer
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aesir"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aesir-network

  # Nginx Reverse Proxy - unified entry point for all services
  # Routes: /linear/*, /github/*, /slack/*, /agent/*
  nginx:
    image: nginx:1.25-alpine
    container_name: aesir-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker-config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      linear-integration:
        condition: service_healthy
      github-integration:
        condition: service_healthy
      slack-integration:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks:
      - aesir-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Linear Integration - handles Linear webhooks and MCP tools
  # Dispatches normalized events to agent-service for routing
  linear-integration:
    build:
      context: .
      dockerfile: packages/integrations/linear/Dockerfile
    container_name: aesir-linear-integration
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    environment:
      # Database connection
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=aesir
      - DB_PASSWORD=aesir
      - DB_NAME=aesir
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # Linear configuration
      - LINEAR_WEBHOOK_SECRET=${LINEAR_WEBHOOK_SECRET}
      - LINEAR_CLIENT_ID=${LINEAR_CLIENT_ID}
      - LINEAR_CLIENT_SECRET=${LINEAR_CLIENT_SECRET}
      - LINEAR_OAUTH_CALLBACK_URL=${LINEAR_OAUTH_CALLBACK_URL:-}
      # Event dispatch (Docker network)
      - ROUTER_URL=http://agent-service:3004/events
      # Server configuration
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/integrations/linear/src
        - action: rebuild
          path: ./packages/integrations/linear/package.json
        - action: rebuild
          path: ./packages/types/src

  # GitHub Integration - handles GitHub webhooks and MCP tools
  # Dispatches normalized events to agent-service for routing
  github-integration:
    build:
      context: .
      dockerfile: packages/integrations/github/Dockerfile
    container_name: aesir-github-integration
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    environment:
      # Database connection
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=aesir
      - DB_PASSWORD=aesir
      - DB_NAME=aesir
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # GitHub configuration
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_OAUTH_CALLBACK_URL=${GITHUB_OAUTH_CALLBACK_URL:-}
      # Event dispatch (Docker network)
      - ROUTER_URL=http://agent-service:3004/events
      # Server configuration
      - PORT=3002
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/integrations/github/src
        - action: rebuild
          path: ./packages/integrations/github/package.json
        - action: rebuild
          path: ./packages/types/src

  # Slack Integration - handles Slack events and MCP tools
  # IMPORTANT: Configure in Slack App Dashboard (api.slack.com):
  #   - Interactivity & Shortcuts URL: https://{your-tunnel}/slack/interactions
  #   This receives button clicks for plan approval/rejection
  slack-integration:
    build:
      context: .
      dockerfile: packages/integrations/slack/Dockerfile
    container_name: aesir-slack-integration
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    environment:
      # Database connection
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=aesir
      - DB_PASSWORD=aesir
      - DB_NAME=aesir
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # Slack configuration
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - SLACK_MODE=${SLACK_MODE:-socket}
      - SLACK_OAUTH_CALLBACK_URL=${SLACK_OAUTH_CALLBACK_URL:-}
      # Event dispatch (Docker network)
      - ROUTER_URL=http://agent-service:3004/events
      # Server configuration
      - PORT=3003
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/integrations/slack/src
        - action: rebuild
          path: ./packages/integrations/slack/package.json
        - action: rebuild
          path: ./packages/types/src

  # Agent Service - unified agent runtime replacing dev-agent, product-agent, and router
  # Handles all event routing, conversation execution, and worker polling in a single process.
  # Events: POST /events (from integration dispatchers)
  # Management: GET /conversations/:id, POST /conversations/:id/cancel
  # Health: GET /health
  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aesir-agent-service
    # Run as root to access Docker socket for DevContainerManager
    # The container is already isolated; Docker access is required for code sandboxing
    user: root
    depends_on:
      postgresql:
        condition: service_healthy
      linear-integration:
        condition: service_healthy
      github-integration:
        condition: service_healthy
      slack-integration:
        condition: service_healthy
      # The embedding model must exist before the first directory_find, not
      # merely be on its way: on a cold machine the pull is a real download.
      ollama-init:
        condition: service_completed_successfully
    environment:
      # Database
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=aesir
      - DB_PASSWORD=aesir
      - DB_NAME=aesir
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # LLM
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Workspace config
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_BASE_BRANCH=${GITHUB_BASE_BRANCH:-main}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      - DEV_AGENT_SLACK_CHANNEL=${DEV_AGENT_SLACK_CHANNEL}
      - PRODUCT_AGENT_ALLOWED_CHANNELS=${PRODUCT_AGENT_ALLOWED_CHANNELS:-}
      # MCP URLs
      - LINEAR_MCP_URL=http://linear-integration:3001
      - GITHUB_MCP_URL=http://github-integration:3002
      - SLACK_MCP_URL=http://slack-integration:3003
      # Service config
      - AGENT_SERVICE_PORT=3004
      - MAX_CONCURRENT_CONVERSATIONS=${MAX_CONCURRENT_CONVERSATIONS:-5}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-5000}
      - FORCE_SHUTDOWN_TIMEOUT_MS=${FORCE_SHUTDOWN_TIMEOUT_MS:-30000}
      # Router config
      - ROUTER_ALERTS_CHANNEL=${ROUTER_ALERTS_CHANNEL:-}
      # Observability
      - NODE_ENV=${NODE_ENV:-production}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-aesir-agents}
    ports:
      - "3004:3004"
    volumes:
      # Mount Docker socket for DevContainerManager
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS alternative path
      - ${HOME}/.docker/run/docker.sock:/var/run/docker.sock:ro
    command: ["node", "dist/service/main.js"]
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/agents/src
        - action: rebuild
          path: ./packages/agents/package.json
        - action: rebuild
          path: ./packages/agents/definitions
        - action: rebuild
          path: ./packages/types/src
        - action: rebuild
          path: ./packages/platform/src

  # Dashboard - Next.js operations dashboard for agent monitoring
  # Provides read-only visibility into conversations, agents, tools, and system health
  # Access: http://localhost:3005 (direct) or http://localhost/dashboard/ (via nginx)
  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: aesir-dashboard
    depends_on:
      postgresql:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    environment:
      # Database connection (read-only access to existing schemas)
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=aesir
      - DB_PASSWORD=aesir
      - DB_NAME=aesir
      # Agent service API (Docker network)
      - AGENT_SERVICE_URL=http://agent-service:3004
      # Server configuration
      - PORT=3005
      - HOSTNAME=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3005/dashboard/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/dashboard/src
        - action: rebuild
          path: ./packages/dashboard/package.json

  # Ollama - local embedding model for shared memory (Phase 68)
  ollama:
    image: ollama/ollama:latest
    container_name: aesir-ollama
    volumes:
      - aesir-ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aesir-network

  # Ollama model init - pulls the embedding model on first start
  # Runs once and exits. Uses the same volume so the model persists across restarts.
  ollama-init:
    image: ollama/ollama:latest
    container_name: aesir-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-nomic-embed-text}"]
    networks:
      - aesir-network
    restart: "no"

  # Cloudflare Tunnel - exposes services to external webhooks (Linear, GitHub, Slack)
  # Configure tunnel to point to nginx:80 for unified routing
  # Requires CLOUDFLARE_TUNNEL_TOKEN from Zero Trust dashboard
  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    container_name: aesir-cloudflared
    restart: unless-stopped
    # --no-autoupdate: prevents container from updating itself
    # --metrics=0.0.0.0:2000: exposes /ready endpoint for health checks
    command: tunnel --no-autoupdate --metrics=0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - aesir-network
    depends_on:
      nginx:
        condition: service_healthy
    profiles:
      - tunnel

  # Health check sidecar for cloudflared tunnel readiness
  cloudflared-health:
    image: quay.io/curl/curl:8.10.1
    container_name: aesir-cloudflared-health
    init: true
    command: sleep infinity
    depends_on:
      - cloudflared
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://cloudflared:2000/ready"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks:
      - aesir-network
    profiles:
      - tunnel

volumes:
  aesir-postgresql:
    name: aesir-postgresql
  aesir-ollama:
    name: aesir-ollama

networks:
  aesir-network:
    name: aesir-network
