# Aesir Development Infrastructure
#
# Complete containerized setup including agents, integrations, and infrastructure.
# Nginx reverse proxy provides a single entry point for all services.
#
# Basic Usage:
#   docker compose up -d                    # Start all services in background
#   docker compose up                       # Start all services with logs
#   docker compose logs -f dev-agent        # View agent logs
#   docker compose down                     # Stop all services
#
# Hot Reload (Watch Mode):
#   docker compose watch                    # Watch all services for file changes
#                                           # Rebuilds containers when source changes
#   docker compose up -d && docker compose watch  # Start then watch
#
# Infrastructure Only:
#   docker compose up -d postgresql temporal temporal-ui  # Start infra without agents
#
# Tunnel (Cloudflare):
#   docker compose --profile tunnel up      # Start with webhook tunnel
#   Point tunnel to nginx:80 for unified routing
#
# Access (via nginx proxy on port 80):
#   - http://localhost/linear/*   → Linear integration (webhooks, OAuth, MCP)
#   - http://localhost/github/*   → GitHub integration (webhooks, OAuth, MCP)
#   - http://localhost/slack/*    → Slack integration (events, OAuth, MCP)
#   - http://localhost/agent/*    → Dev agent
#   - http://localhost/health     → Nginx health check
#
# Direct Access (bypass nginx):
#   - PostgreSQL: localhost:5432
#   - Temporal gRPC: localhost:7233
#   - Temporal UI: http://localhost:8080
#   - Linear Integration: http://localhost:3001
#   - GitHub Integration: http://localhost:3002
#   - Slack Integration: http://localhost:3003
#   - Dev Agent: http://localhost:3004
#
# Webhook URLs (configure in each service):
#   - Linear:  https://<tunnel>/linear/webhook
#   - GitHub:  https://<tunnel>/github/webhooks/github
#   - Slack:   https://<tunnel>/slack/events
#
# OAuth URLs:
#   - Linear: http://localhost/linear/oauth/authorize
#   - GitHub: http://localhost/github/oauth/github/authorize
#   - Slack:  http://localhost/slack/oauth/authorize
#
# Environment:
#   Copy .env.example to .env and fill in API keys.
#   Docker Compose automatically loads .env file.

services:
  postgresql:
    image: postgres:15-alpine
    container_name: aesir-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Expose for LangGraph checkpointer
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aesir-network

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: aesir-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yml
    ports:
      - "7233:7233" # gRPC Frontend
    volumes:
      - ./temporal-config/dynamic_config.yml:/etc/temporal/dynamic_config.yml:ro
    networks:
      - aesir-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: aesir-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - aesir-network

  # Nginx Reverse Proxy - unified entry point for all services
  # Routes: /linear/*, /github/*, /slack/*, /agent/*
  nginx:
    image: nginx:1.25-alpine
    container_name: aesir-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - linear-integration
      - github-integration
      - slack-integration
    networks:
      - aesir-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Linear Integration - handles Linear webhooks and MCP tools
  linear-integration:
    build:
      context: .
      dockerfile: packages/integrations/linear/Dockerfile
    container_name: aesir-linear-integration
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    environment:
      # Database connection
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=temporal
      - DB_PASSWORD=temporal
      - DB_NAME=temporal
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # Linear configuration
      - LINEAR_WEBHOOK_SECRET=${LINEAR_WEBHOOK_SECRET}
      - LINEAR_CLIENT_ID=${LINEAR_CLIENT_ID}
      - LINEAR_CLIENT_SECRET=${LINEAR_CLIENT_SECRET}
      # Server configuration
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/integrations/linear/src
        - action: rebuild
          path: ./packages/integrations/linear/package.json
        - action: rebuild
          path: ./packages/common/src

  # GitHub Integration - handles GitHub webhooks and MCP tools
  github-integration:
    build:
      context: .
      dockerfile: packages/integrations/github/Dockerfile
    container_name: aesir-github-integration
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    environment:
      # Database connection
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=temporal
      - DB_PASSWORD=temporal
      - DB_NAME=temporal
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # GitHub configuration
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # Server configuration
      - PORT=3002
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/integrations/github/src
        - action: rebuild
          path: ./packages/integrations/github/package.json
        - action: rebuild
          path: ./packages/common/src

  # Slack Integration - handles Slack events and MCP tools
  slack-integration:
    build:
      context: .
      dockerfile: packages/integrations/slack/Dockerfile
    container_name: aesir-slack-integration
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    environment:
      # Database connection
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=temporal
      - DB_PASSWORD=temporal
      - DB_NAME=temporal
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # Slack configuration
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_MODE=http
      # Server configuration
      - PORT=3003
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/integrations/slack/src
        - action: rebuild
          path: ./packages/integrations/slack/package.json
        - action: rebuild
          path: ./packages/common/src

  # Dev Agent - handles Linear task automation via MCP
  # Communicates with integration services via HTTP (no direct SDK access)
  dev-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aesir-dev-agent
    # Run as root to access Docker socket for sandbox execution
    # The container is already isolated; Docker access is required for code sandboxing
    user: root
    depends_on:
      temporal:
        condition: service_started # Temporal binds to network IP, not localhost
      postgresql:
        condition: service_healthy
      linear-integration:
        condition: service_healthy
      github-integration:
        condition: service_healthy
      slack-integration:
        condition: service_healthy
    environment:
      # Database (internal Docker network)
      - DATABASE_URL=postgresql://temporal:temporal@postgresql:5432/temporal
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=temporal
      - DB_PASSWORD=temporal
      - DB_NAME=temporal
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # Temporal (internal Docker network)
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      # LLM (only API key needed by agents)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Webhook secrets (for legacy webhook endpoints and event validation)
      - LINEAR_WEBHOOK_SECRET=${LINEAR_WEBHOOK_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # Workspace configuration (passed to MCP calls)
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID}
      - GITHUB_REPO=${GITHUB_REPO}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      # MCP service URLs (Docker network names)
      - LINEAR_MCP_URL=http://linear-integration:3001
      - GITHUB_MCP_URL=http://github-integration:3002
      - SLACK_MCP_URL=http://slack-integration:3003
      # Observability (optional)
      - NODE_ENV=${NODE_ENV:-production}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-aesir-agents}
    ports:
      - "3004:3004" # Webhook endpoint (Linear uses 3001, GitHub 3002, Slack 3003)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "dist/scripts/start-dev-agent.js"]
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/agents/src
        - action: rebuild
          path: ./packages/agents/package.json
        - action: rebuild
          path: ./packages/common/src
        - action: rebuild
          path: ./packages/platform/src

  # Product Agent - handles Slack conversations via MCP
  # Communicates with integration services via HTTP (no direct SDK access)
  product-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aesir-product-agent
    depends_on:
      postgresql:
        condition: service_healthy
      linear-integration:
        condition: service_healthy
      github-integration:
        condition: service_healthy
      slack-integration:
        condition: service_healthy
    environment:
      # Database (internal Docker network)
      - DATABASE_URL=postgresql://temporal:temporal@postgresql:5432/temporal
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=temporal
      - DB_PASSWORD=temporal
      - DB_NAME=temporal
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      # LLM (only API key needed by agents)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Workspace configuration (passed to MCP calls)
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID}
      - GITHUB_REPO=${GITHUB_REPO}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      # MCP service URLs (Docker network names)
      - LINEAR_MCP_URL=http://linear-integration:3001
      - GITHUB_MCP_URL=http://github-integration:3002
      - SLACK_MCP_URL=http://slack-integration:3003
      # Observability (optional)
      - NODE_ENV=${NODE_ENV:-production}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-aesir-agents}
    command: ["node", "dist/scripts/start-product-agent.js"]
    networks:
      - aesir-network
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./packages/agents/src
        - action: rebuild
          path: ./packages/agents/package.json
        - action: rebuild
          path: ./packages/common/src
        - action: rebuild
          path: ./packages/platform/src

  # Cloudflare Tunnel - exposes services to external webhooks (Linear, GitHub, Slack)
  # Configure tunnel to point to nginx:80 for unified routing
  # Requires CLOUDFLARE_TUNNEL_TOKEN from Zero Trust dashboard
  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    container_name: aesir-cloudflared
    restart: unless-stopped
    # --no-autoupdate: prevents container from updating itself
    # --metrics=0.0.0.0:2000: exposes /ready endpoint for health checks
    command: tunnel --no-autoupdate --metrics=0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - aesir-network
    depends_on:
      nginx:
        condition: service_healthy
    profiles:
      - tunnel

  # Health check sidecar for cloudflared tunnel readiness
  cloudflared-health:
    image: quay.io/curl/curl:8.10.1
    container_name: aesir-cloudflared-health
    init: true
    command: sleep infinity
    depends_on:
      - cloudflared
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://cloudflared:2000/ready"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks:
      - aesir-network
    profiles:
      - tunnel

volumes:
  temporal-postgresql:
    name: aesir-temporal-postgresql

networks:
  aesir-network:
    name: aesir-network
