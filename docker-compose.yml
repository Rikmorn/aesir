# Aesir Local Development Infrastructure
#
# Provides Temporal server and related services for local development.
# Agents run on the host for easier debugging; infrastructure in Docker.
#
# Usage:
#   npm run infra:up      # Start infrastructure
#   npm run infra:down    # Stop infrastructure
#   npm run infra:logs    # View logs
#
# Access:
#   - Temporal UI: http://localhost:8080
#   - Temporal gRPC: localhost:7233

services:
  postgresql:
    image: postgres:15-alpine
    container_name: aesir-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aesir-network

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: aesir-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yml
    ports:
      - "7233:7233"  # gRPC Frontend
    volumes:
      - ./temporal-config/dynamic_config.yml:/etc/temporal/dynamic_config.yml:ro
    networks:
      - aesir-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "localhost:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: aesir-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - aesir-network

volumes:
  temporal-postgresql:
    name: aesir-temporal-postgresql

networks:
  aesir-network:
    name: aesir-network
