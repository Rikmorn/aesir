# Aesir Development Infrastructure
#
# Complete containerized setup including agents and supporting services.
#
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose up -d postgresql temporal temporal-ui  # Infrastructure only
#   docker compose logs -f dev-agent        # View agent logs
#   docker compose down                     # Stop all
#
# Access:
#   - Temporal UI: http://localhost:8080
#   - Temporal gRPC: localhost:7233
#   - Dev Agent webhooks: http://localhost:3001
#   - Product Agent (Socket Mode): connects to Slack
#   - Cloudflared (requires setup): exposes webhooks via Cloudflare Tunnel
#
# Environment:
#   Copy .env.example to .env and fill in API keys.
#   Docker Compose automatically loads .env file.

services:
  postgresql:
    image: postgres:15-alpine
    container_name: aesir-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Expose for LangGraph checkpointer
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aesir-network

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: aesir-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yml
    ports:
      - "7233:7233" # gRPC Frontend
    volumes:
      - ./temporal-config/dynamic_config.yml:/etc/temporal/dynamic_config.yml:ro
    networks:
      - aesir-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: aesir-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - aesir-network

  # Dev Agent - handles Linear task automation
  dev-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aesir-dev-agent
    depends_on:
      temporal:
        condition: service_started # Temporal binds to network IP, not localhost
      postgresql:
        condition: service_healthy
    environment:
      # Database (internal Docker network)
      - DATABASE_URL=postgresql://temporal:temporal@postgresql:5432/temporal
      # Temporal (internal Docker network)
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      # API Keys (from .env file)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LINEAR_ACCESS_TOKEN=${LINEAR_ACCESS_TOKEN}
      - LINEAR_CLIENT_ID=${LINEAR_CLIENT_ID}
      - LINEAR_CLIENT_SECRET=${LINEAR_CLIENT_SECRET}
      - LINEAR_WEBHOOK_SECRET=${LINEAR_WEBHOOK_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      # Optional
      - NODE_ENV=${NODE_ENV:-production}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-aesir-agents}
    ports:
      - "3001:3001" # Webhook endpoint
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "dist/scripts/start-dev-agent.js"]
    networks:
      - aesir-network
    restart: unless-stopped

  # Product Agent - handles Slack conversations
  product-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aesir-product-agent
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # Database (internal Docker network)
      - DATABASE_URL=postgresql://temporal:temporal@postgresql:5432/temporal
      # API Keys (from .env file)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LINEAR_ACCESS_TOKEN=${LINEAR_ACCESS_TOKEN}
      - LINEAR_CLIENT_ID=${LINEAR_CLIENT_ID}
      - LINEAR_CLIENT_SECRET=${LINEAR_CLIENT_SECRET}
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      # Optional
      - NODE_ENV=${NODE_ENV:-production}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-aesir-agents}
    command: ["node", "dist/scripts/start-product-agent.js"]
    networks:
      - aesir-network
    restart: unless-stopped

  # Cloudflare Tunnel - exposes webhooks to external services (Linear, GitHub)
  # Requires CLOUDFLARE_TUNNEL_TOKEN from Zero Trust dashboard
  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    container_name: aesir-cloudflared
    restart: unless-stopped
    # --no-autoupdate: prevents container from updating itself
    # --metrics=0.0.0.0:2000: exposes /ready endpoint for health checks
    command: tunnel --no-autoupdate --metrics=0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - aesir-network
    depends_on:
      dev-agent:
        condition: service_started
    profiles:
      - tunnel

  # Health check sidecar for cloudflared tunnel readiness
  cloudflared-health:
    image: quay.io/curl/curl:8.10.1
    container_name: aesir-cloudflared-health
    init: true
    command: sleep infinity
    depends_on:
      - cloudflared
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://cloudflared:2000/ready"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks:
      - aesir-network
    profiles:
      - tunnel

  # OAuth Authorization - runs Linear OAuth flow in container
  # Usage: docker compose run --rm oauth
  # Requires: OAUTH_CALLBACK_URL pointing to a Cloudflare tunnel
  oauth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aesir-oauth
    environment:
      - LINEAR_CLIENT_ID=${LINEAR_CLIENT_ID}
      - LINEAR_CLIENT_SECRET=${LINEAR_CLIENT_SECRET}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL}
    ports:
      - "3000:3000"
    command: ["node", "dist/scripts/linear-oauth.js"]
    volumes:
      # Mount tokens file to host so other services can access it
      - ./.linear-tokens.json:/app/.linear-tokens.json
    networks:
      - aesir-network
    profiles:
      - oauth

volumes:
  temporal-postgresql:
    name: aesir-temporal-postgresql

networks:
  aesir-network:
    name: aesir-network
