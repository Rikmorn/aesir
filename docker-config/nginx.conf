worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Upstream services
    # Passive health check: nginx marks server as failed after connection errors
    upstream linear {
        server linear-integration:3001;
    }

    upstream github {
        server github-integration:3002;
    }

    upstream slack {
        server slack-integration:3003;
    }

    upstream agent-service {
        server agent-service:3004;
    }

    server {
        listen 80;
        server_name _;

        # Health check for nginx itself
        location = /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # Linear Integration
        # Webhook: POST /linear/webhook
        # OAuth:   GET  /linear/oauth/authorize, /linear/oauth/callback
        # MCP:     GET  /linear/mcp/tools, POST /linear/mcp/tools/:name
        # Health:  GET  /linear/health
        location /linear/ {
            proxy_pass http://linear/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass raw body for webhook signature verification
            proxy_pass_request_body on;
            # Timeouts for webhook processing
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Disable buffering for faster webhook response
            proxy_buffering off;
        }

        # GitHub Integration
        # Webhook: POST /github/webhooks/github
        # OAuth:   GET  /github/oauth/github/authorize, /github/oauth/github/callback
        # MCP:     GET  /github/mcp/tools, POST /github/mcp/tools/:name
        # Health:  GET  /github/health
        location /github/ {
            proxy_pass http://github/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_body on;
            # Timeouts for webhook processing
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Disable buffering for faster webhook response
            proxy_buffering off;
        }

        # Slack Integration
        # Events:  POST /slack/events
        # OAuth:   GET  /slack/oauth/authorize, /slack/oauth/callback
        # MCP:     GET  /slack/mcp/tools, POST /slack/mcp/tools/:name
        # Health:  GET  /slack/health
        location /slack/ {
            proxy_pass http://slack/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_body on;
            # Timeouts for webhook processing
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # Disable buffering for faster webhook response
            proxy_buffering off;
        }

        # Agent Service (unified event routing + conversation management)
        # Events: POST /agent/events (from integration dispatchers via tunnel)
        # Management: GET /agent/conversations/:id, POST /agent/conversations/:id/cancel
        # Health: GET /agent/health
        location /agent/ {
            proxy_pass http://agent-service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Extended timeout for LLM-based routing (slow path)
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Root - show available routes
        location = / {
            return 200 '{"routes":{"/linear/*":"Linear integration","/github/*":"GitHub integration","/slack/*":"Slack integration","/agent/*":"Agent service (events, conversations, health)","/health":"Nginx health"}}';
            add_header Content-Type application/json;
        }
    }
}
