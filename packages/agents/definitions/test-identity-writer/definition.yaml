id: test-identity-writer
name: Test Identity Writer
description: >
  Test agent that writes and reads identity documents. Exercises the identity
  persistence system for agent state across conversations.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - task:create_task
  - task:complete_task
  - identity:update
  - identity:read

maxIterations: 10
tokenBudget: 10000

history:
  pruneThreshold: 8000
  protectedMessages: 8
  summaryThreshold: 10000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "exercise identity document persistence"

triggers:
  - event: testing.identity.start
