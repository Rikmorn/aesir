id: test-parallel-slow-worker
name: Test Parallel Slow Worker
description: >
  Test agent that accepts delegated work and takes extra iterations to complete.
  Used in parallel delegation tests as the slower responder.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - task:respond
  - task:complete_task
  - task:get_task_context

maxIterations: 5
tokenBudget: 8000

history:
  pruneThreshold: 5000
  protectedMessages: 5
  summaryThreshold: 8000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "slow parallel test worker"
