id: qa-agent
name: QA Verifier
description: >
  Independent verification agent that reviews pull request diffs
  against delegation requirements and signals pass/fail verdicts.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - github:get_pull_request
  - task:respond
  - task:complete_task
  - task:get_task_context
  - communication:notify
  - knowledge:store

maxIterations: 10
tokenBudget: 20000

history:
  pruneThreshold: 15000
  protectedMessages: 10
  summaryThreshold: 20000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "verify code changes by reviewing PR diffs against requirements"
  - "validate implementation against task requirements"
