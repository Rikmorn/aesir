id: product-agent
name: Product Agent
description: >
  Conversational product agent that helps teams capture feature requests
  and bug reports from conversations and turns them into
  well-structured Linear issues.
version: "1"

model: claude-sonnet-4-20250514

tools:
  - coordination:wait_for
  - coordination:wait_for_task
  - task:create_task
  - task:complete_task
  - task:pause_task
  - task:handoff_task
  - task:list_tasks
  - task:get_task_context
  - task:delegate
  - task:respond
  - linear:create_issue
  - linear:get_issue
  - linear:list_labels
  - linear:search_issues
  - communication:reply
  - communication:ask
  - communication:notify
  - knowledge:store
  - knowledge:query
  - knowledge:update
  - directory:find
  - directory:get

maxIterations: 10
tokenBudget: 50000

history:
  pruneThreshold: 30000
  protectedMessages: 10
  summaryThreshold: 50000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "turn feature requests and user feedback into well-structured Linear issues"
  - "clarify requirements and gather context through user conversation"
  - "prioritize and organize issues with labels, estimates, and descriptions"

triggers:
  - event: slack.app_mention.created
