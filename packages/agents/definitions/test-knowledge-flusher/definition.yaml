id: test-knowledge-flusher
name: Test Knowledge Flusher
description: >
  Test agent that generates enough conversation to trigger compaction, verifying
  that knowledge flush fires before history is pruned.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - task:create_task
  - task:complete_task
  - knowledge:store
  - knowledge:query

maxIterations: 15
tokenBudget: 20000

history:
  pruneThreshold: 4000
  protectedMessages: 3
  summaryThreshold: 5000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "exercise knowledge flush before compaction"

triggers:
  - event: testing.knowledgeflush.start
