id: test-clarify-delegator
name: Test Clarification Delegator
description: >
  Test agent that delegates a task and answers clarification questions from the
  worker. Exercises the clarification round-trip protocol.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - task:create_task
  - task:complete_task
  - task:delegate
  - task:answer
  - coordination:wait_for
  - coordination:wait_for_task
  - directory:find

maxIterations: 15
tokenBudget: 15000

history:
  pruneThreshold: 10000
  protectedMessages: 10
  summaryThreshold: 15000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "initiate clarification test workflows"

triggers:
  - event: testing.clarify.start
