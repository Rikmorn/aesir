id: dev-agent
name: Development Agent
description: >
  Autonomous development agent that resolves Linear issues through
  codebase research, planning, implementation via sub-agents, testing,
  and pull request creation.
version: "1"

model: claude-sonnet-4-20250514
temperature: 0

tools:
  - codebase:read_file
  - codebase:search_codebase
  - codebase:list_directory
  - coordination:spawn_agent
  - coordination:request_human_input
  - coordination:wait_for
  - coordination:wait_for_task
  - task:create_task
  - task:complete_task
  - task:pause_task
  - task:handoff_task
  - task:list_tasks
  - task:get_task_context
  - task:delegate
  - task:respond
  - task:clarify
  - task:answer
  - linear:get_issue
  - linear:update_issue_status
  - github:create_branch
  - github:create_commit
  - github:create_pull_request
  - github:get_pull_request
  - communication:reply
  - communication:ask
  - communication:notify
  - knowledge:store
  - knowledge:query
  - knowledge:update
  - identity:update
  - identity:read
  - directory:find
  - directory:get

subAgents:
  researcher: researcher
  coder: coder
  tester: tester

maxIterations: 100
tokenBudget: 500000

history:
  pruneThreshold: 80000
  protectedMessages: 20
  summaryThreshold: 120000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "implement features by writing code, creating branches, and opening pull requests"
  - "debug failures, investigate issues, and deliver fixes"
  - "research codebases to understand architecture, patterns, and dependencies"
  - "run test suites and validate code changes meet requirements"
  - "address pull request review feedback and iterate until approved"

triggers:
  - event: linear.agent_session.created
