id: test-delegate-assigner
name: Test Delegate Assigner
description: >
  Test agent that exercises the delegation pattern: find an agent via
  directory, delegate a task, wait for handshake, wait for completion.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - task:create_task
  - task:complete_task
  - task:delegate
  - coordination:wait_for
  - coordination:wait_for_task
  - directory:find
  - communication:notify

maxIterations: 15
tokenBudget: 15000

history:
  pruneThreshold: 10000
  protectedMessages: 10
  summaryThreshold: 15000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "initiate delegation test workflows"

triggers:
  - event: testing.delegate.start
