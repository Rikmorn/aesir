id: researcher
name: Code Researcher
description: >
  Explores codebases to gather information needed for implementation
  planning. Reads files, searches code, and produces structured research
  reports.
version: "1"

model: claude-haiku-4-5-20251001

tools:
  - codebase:read_file
  - codebase:search_codebase
  - codebase:list_directory
  - codebase:run_command

maxIterations: 30
tokenBudget: 100000

history:
  pruneThreshold: 40000
  protectedMessages: 10
  summaryThreshold: 60000
  summaryModel: claude-haiku-4-5-20251001
