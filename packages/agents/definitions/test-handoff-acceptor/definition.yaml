id: test-handoff-acceptor
name: Test Handoff Acceptor
description: >
  Test agent that accepts handed-off tasks and completes them
  independently. Exercises the acceptor side of the hand-off pattern.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - task:respond
  - task:complete_task
  - task:get_task_context

maxIterations: 5
tokenBudget: 8000

history:
  pruneThreshold: 5000
  protectedMessages: 5
  summaryThreshold: 8000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "accept handed-off test tasks"
