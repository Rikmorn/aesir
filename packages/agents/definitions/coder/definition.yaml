id: coder
name: Code Implementer
description: >
  Writes and modifies code according to implementation plans. Produces
  working, type-safe code that compiles and passes linting.
version: "1"

model: claude-haiku-4-5-20251001

tools:
  - codebase:read_file
  - codebase:write_file
  - codebase:search_codebase
  - codebase:run_command

maxIterations: 40
tokenBudget: 100000

history:
  pruneThreshold: 40000
  protectedMessages: 10
  summaryThreshold: 60000
  summaryModel: claude-haiku-4-5-20251001
