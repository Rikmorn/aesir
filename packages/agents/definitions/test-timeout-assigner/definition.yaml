id: test-timeout-assigner
name: Test Timeout Assigner
description: >
  Test agent that delegates to an agent that never responds. Validates
  that the 30s timeout fires and the assigner handles it gracefully.
version: "1"

model: claude-haiku-4-5-20251001
temperature: 0

tools:
  - task:create_task
  - task:complete_task
  - task:delegate
  - coordination:wait_for
  - directory:find
  - communication:notify

maxIterations: 15
tokenBudget: 15000

history:
  pruneThreshold: 10000
  protectedMessages: 10
  summaryThreshold: 15000
  summaryModel: claude-haiku-4-5-20251001

capabilities:
  - "initiate timeout test workflows"

triggers:
  - event: testing.timeout.start
